plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
    id 'maven-publish'
}

version = '26.3'
group = 'com.mp3player'

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

configurations {
    bundleLib {
        transitive = false
    }
    implementation.extendsFrom(bundleLib)
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.165.0+26.3"

    bundleLib "io.github.humbleui:skija-shared:0.143.17"
    bundleLib "io.github.humbleui:skija-windows-x64:0.143.17"
    bundleLib "io.github.humbleui:types:0.2.0"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude "ffmpeg.exe"
    from {
        configurations.bundleLib.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        exclude "META-INF/INDEX.LIST"
        exclude "io/github/humbleui/skija/impl/Cleanable*.class"
        exclude "io/github/humbleui/skija/impl/ReferenceUtil*.class"
        exclude "io/github/humbleui/skija/impl/ResourceFinder*.class"
        exclude "org/lwjgl/system/**"
        exclude "org/lwjgl/PointerBuffer*"
        exclude "org/lwjgl/CLongBuffer*"
    }
    doLast {
        new ProcessBuilder("python", "patch_jar.py", archiveFile.get().asFile.absolutePath)
            .inheritIO()
            .start()
            .waitFor()
    }
}

test {
    enabled = false
}
